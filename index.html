<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Electric Bass Fretboard - Training</title>
  <style>
:root { --orange:#e6bd89; --orange-deep:#df7f2b; --accent-border:#826649; --board-crop:38.8235294117647px; color-scheme:dark; font-family:ui-rounded,"Hiragino Sans",system-ui,sans-serif; background:#000; color:#f5f2e9; }
* { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
body { background:#000; margin:0; -webkit-text-size-adjust:100%; }
.app-viewport-wrapper { width:100%; }
main { width:100%; max-width:940px; margin:auto; padding:0 max(12px,env(safe-area-inset-right)) max(20px,env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left)); }
.controls { position:sticky; top:0; z-index:20; padding:max(10px,env(safe-area-inset-top)) 0 6px; background:#000; display:flex; flex-direction:column; gap:10px; }
.top-controls { display:flex; flex-direction:column; gap:8px; }
.action-row { display:grid; grid-template-columns:1fr 1fr; gap:8px; width:100%; }
button,select { font:inherit; font-size:16px; border-radius:12px; min-height:46px; border:1px solid #49483e; padding:9px 10px; touch-action:manipulation; }
button { background:linear-gradient(180deg,#302820,#29231e); color:var(--orange); border-color:var(--accent-border); font-weight:750; cursor:pointer; }
button.primary-btn { background:linear-gradient(90deg,#f2b45f 0%,#e99942 48%,#d87928 100%); border-color:#e99c58; color:#241406; box-shadow:0 2px 5px #0003; }
button.secondary { background:linear-gradient(180deg,#ecd0ab,#dfba8e); border-color:#e5c39a; color:#302318; }
button:active { filter:brightness(.85); }
button:disabled,select:disabled { opacity:.45; cursor:default; }
button:focus-visible,.cell:focus-visible { outline:3px solid #9ddcff; outline-offset:2px; }
select { border-width:2px; background:#28231e; color:var(--orange); border-color:var(--accent-border); width:100%; min-width:0; }
#question-type:focus, #note-count:focus { outline:none; border-color:var(--accent-border); box-shadow:none; }
.status-container { width:100%; display:flex; flex-direction:column; gap:6px; }
.chord-row { display:flex; align-items:center; justify-content:space-between; gap:10px; background:#28221c; border:2px solid #594735; padding:5px 12px; border-radius:14px; min-height:56px; }
.status-label { font-size:10px; letter-spacing:.12em; color:#b7a590; }
#target-title { font-size:21px; font-weight:800; color:var(--orange); overflow-wrap:anywhere; }
.small-btn { font-size:13px; flex-shrink:0; }
#play-chord-arpeggio { min-height:36px; height:36px; padding:5px 10px; line-height:24px; white-space:nowrap; background:linear-gradient(180deg,#ecd0ab,#dfba8e); border-color:#e5c39a; color:#17110a; }
#level-indicator { font-size:15px; white-space:pre-line; margin-top:10px; color:#b7ac9c; line-height:1.5; }
#status-box { min-height:52px; margin:0; padding:8px 12px; border:2px solid #494038; border-radius:14px; background:#24201b; display:flex; align-items:center; justify-content:center; font-size:21px; font-weight:800; }
#status-box.status-correct { color:#99e6ad; border-color:#99e6ad; background:#213428; }
#status-box.status-wrong { color:#ff9b91; border-color:#ff9b91; background:#382521; }
.settings-row { display:flex; flex-wrap:wrap; align-items:center; gap:8px; position:relative; }
.control-group { display:flex; align-items:center; gap:6px; font-size:12px; min-width:0; }
.control-group label { flex-shrink:0; }
#label-q-type, #label-note-count { position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip-path:inset(50%); white-space:nowrap; border:0; }
#first-note-group { min-width:0; }
#first-note-mode { border:0; padding:0; margin:0; min-width:0; }
#note-count-group { flex:0 0 auto; gap:4px; }
#question-type-group { gap:4px; flex-shrink:0; }
#question-type { width:auto; flex-shrink:0; }
#note-count { width:auto; flex-shrink:0; }
.settings-btn { font-size:13px; padding-inline:8px; border-width:2px; background:#343e43; border-color:#637078; color:#e0e5e7; }
.settings-popup { display:none; position:absolute; top:52px; left:0; z-index:30; width:min(340px,100%); padding:12px; background:#000; border:1px solid var(--accent-border); border-radius:16px; box-shadow:0 12px 40px #0009; }
.settings-popup.active { display:flex; flex-direction:column; gap:10px; }
.settings-popup h3 { margin:0; font-size:16px; }
.setting-item label { display:block; margin-bottom:6px; font-size:13px; }
.settings-popup .setting-item label { margin-bottom:4px; }
.settings-popup .setting-opt-btn { min-height:40px; padding:7px 8px; }
@media(max-height:500px) and (min-width:480px) {
  .settings-popup { width:min(560px,100%); }
  .settings-popup.active { display:grid; grid-template-columns:1fr 1fr; gap:10px 12px; }
  .settings-popup h3 { grid-column:1 / -1; }
}
.setting-options { display:flex; gap:6px; }
.setting-opt-btn { flex:1; font-size:13px; border-width:2px; }
.setting-opt-btn.active { background:linear-gradient(180deg,#ecd0ab,#dfba8e); border-color:#e5c39a; color:#302318; box-shadow:none; }
.board-shell { width:100%; overflow-x:auto; overflow-y:hidden; border-radius:14px; background:#251d17; overscroll-behavior-x:contain; touch-action:none; scrollbar-width:none; }
.board-shell::-webkit-scrollbar { display:none; width:0; height:0; }
.board-track { display:flex; width:calc(900px - var(--board-crop)); }
.board-crop { flex:0 0 calc(900px - var(--board-crop)); width:calc(900px - var(--board-crop)); height:206px; overflow:hidden; }
#fretboard { display:block; margin-top:-44px; margin-left:calc(0px - var(--board-crop)); width:900px; height:300px; background:#372018; }
.board-shell,.board-shell * { touch-action:none; -webkit-touch-callout:none!important; -webkit-user-select:none!important; user-select:none!important; -webkit-user-drag:none; }
.root-marker { fill:#ff4d4d33; stroke:#ff6262; stroke-width:2.5; pointer-events:none; }
.note { fill:#f6e7d0; font-size:12px; font-weight:750; text-anchor:middle; pointer-events:none; }
.string-name { fill:#f6e7d0; font-size:16px; font-weight:800; text-anchor:end; pointer-events:none; }
.hint { margin-top:12px; display:flex; flex-wrap:wrap; gap:10px; align-items:center; font-size:12px; color:#b7ac9c; }
#deck-counter { width:100%; text-align:center; color:#efd29a; font-size:20px; line-height:1.5; font-weight:750; border:1px solid var(--accent-border); border-radius:10px; padding:6px 12px; background:#28221c; }
#deck-counter.hard-mode { width:100%; text-align:center; color:#ffd3e7; border:2px solid #f276b0; background:linear-gradient(110deg,#482035,#30202b); box-shadow:0 0 14px #f276b040; }
.board-navigation { padding:4px 0 0; }
.scroll-pad { min-height:48px; padding:8px 12px; gap:10px; display:flex; align-items:center; justify-content:center; border:1px solid #494038; border-radius:10px; background:#24201b; color:#c4b9a9; font-size:14px; font-weight:500; cursor:grab; touch-action:none; -webkit-touch-callout:none; -webkit-user-select:none; user-select:none; }
.scroll-pad:active { cursor:grabbing; background:#342c23; }
.scroll-arrow { font-size:28px; line-height:1; color:var(--orange); flex-shrink:0; }
.scroll-pad:focus-visible { outline:2px solid var(--orange); outline-offset:2px; }
@media(min-width:700px) { .action-row { max-width:520px; } }
@media(max-width:360px) { .settings-row { gap:4px; } .action-row button { font-size:13px; padding:9px 4px; } }
    .cell { cursor: pointer; -webkit-touch-callout: none !important; }
    .cell rect { fill: transparent; }
    .cell:focus { outline: none; }
    .cell.playing rect { fill: #ffbd3f8c !important; }
    .cell.playing-correct rect { fill: #87e39ab3 !important; stroke: #87e39a; stroke-width: 2px; }
    .cell.playing-wrong rect { fill: #f27e72b3 !important; stroke: #f27e72; stroke-width: 2px; }
    .cell.computer-first rect { fill: #ffca754f; stroke: #ffca75; stroke-width: 3; }
    .cell.selected rect { fill: #80c7ff70; }
    .cell.correct rect { fill: #87e39a85 !important; stroke: #87e39a; stroke-width: 1.5px; }
    .cell.wrong rect { fill: #f27e7285 !important; stroke: #f27e72; stroke-width: 1.5px; }
    
</style>
</head>
<body>
  <div class="app-viewport-wrapper">
    <main>
      <div class="controls">
        <div class="settings-row">
          <!-- 設定ボタン -->
          <button id="open-settings" class="settings-btn" type="button">⚙️ Settings</button>

          <!-- 設定ポップアップメニュー（設定ボタンの真下） -->
          <div id="settings-popup" class="settings-popup">
            <h3 id="modal-title-settings">⚙️ 設定</h3>
            
            <!-- English ON / OFF 設定 -->
            <div class="setting-item">
              <label id="label-lang-setting">English</label>
              <div class="setting-options">
                <button type="button" class="setting-opt-btn" id="lang-off-btn" data-lang="off">OFF (日本語)</button>
                <button type="button" class="setting-opt-btn" id="lang-on-btn" data-lang="on">ON (English)</button>
              </div>
            </div>

            <div class="setting-item">
              <label id="label-speed-setting">問題の再生スピード</label>
              <div class="setting-options">
                <button type="button" class="setting-opt-btn" id="speed-slow-btn" data-speed="slow">遅い</button>
                <button type="button" class="setting-opt-btn" id="speed-fast-btn" data-speed="fast">速い</button>
              </div>
            </div>

            <div class="setting-item">
              <label id="label-sound-setting">正誤判定のサウンド</label>
              <div class="setting-options">
                <button type="button" class="setting-opt-btn" id="sound-exists-btn" data-sound="exists">あり</button>
                <button type="button" class="setting-opt-btn" id="sound-none-btn" data-sound="none">なし</button>
              </div>
            </div>
          <div class="setting-item" id="first-note-group">
            <label id="label-first-note">コード問題の最初の音</label>
            <fieldset id="first-note-mode" class="setting-options" aria-labelledby="label-first-note">
              <button type="button" class="setting-opt-btn active" id="first-note-root-btn" data-first-note="root" aria-pressed="true">ルート音</button>
              <button type="button" class="setting-opt-btn" id="first-note-random-btn" data-first-note="random" aria-pressed="false">ルート音以外</button>
            </fieldset>
          </div>
          </div>

          <div class="control-group" id="question-type-group">
            <label for="question-type" id="label-q-type">問題:</label>
            <select id="question-type">
              <option value="chord" selected>コード</option>
              <option value="scale">スケール</option>
              <option value="melody">メロディ</option>
            </select>
          </div>

          <div class="control-group" id="note-count-group">
            <label for="note-count" id="label-note-count">音数:</label>
            <select id="note-count">
              <option value="2">2音</option>
              <option value="3" selected>3音</option>
              <option value="4">4音</option>
            </select>
          </div>


        </div>

        <div class="top-controls">
          <div class="action-row">
            <button id="start" class="primary-btn" type="button">▶ ゲームを始める</button>
            <button id="replay" class="secondary" type="button" disabled>🔊 もう一度聴く</button>
          </div>

          <div class="status-container">
            <div class="chord-row">
              <div><div class="status-label" id="target-label" hidden>コード名</div><div id="target-title">---</div></div>
              <button id="play-chord-arpeggio" class="small-btn" type="button" disabled>♫ コードを鳴らす</button>
            </div>
            <div id="status-box" aria-live="polite"><span id="status-message"></span></div>
          </div>
        </div>
      </div>
      
      <div class="board-shell"><div class="board-track"><div class="board-crop">
        <svg id="fretboard" viewBox="0 0 1020 340" role="application" aria-label="4弦エレクトリックベースのフレットボード"></svg>
      </div></div></div>
      <div class="board-navigation">
        <div id="scroll-pad" class="scroll-pad" tabindex="0" role="group" aria-label="指板の横スクロール"><span class="scroll-arrow" aria-hidden="true">↔</span><span id="scroll-description">指板の左右移動はここをスワイプ</span></div>
      </div>
      <div id="level-indicator" hidden></div>
      <div class="hint">
        <div id="deck-counter">連続正解数：0/5　 EASY MODE</div>
      </div>
    </main>
  </div>

  <script>
    const svg = document.querySelector('#fretboard');
    const statusBox = document.querySelector('#status-box');
    const statusMessage = document.querySelector('#status-message');
    const targetTitle = document.querySelector('#target-title');
    const targetLabel = document.querySelector('#target-label');
    const playChordBtn = document.querySelector('#play-chord-arpeggio');
    const levelIndicator = document.querySelector('#level-indicator');
    const startButton = document.querySelector('#start');
    const replayButton = document.querySelector('#replay');
    const questionTypeSelect = document.querySelector('#question-type');
    const noteCountSelect = document.querySelector('#note-count');
    const firstNoteControls = document.querySelector('#first-note-mode');
    const noteCountGroup = document.querySelector('#note-count-group');
    const firstNoteGroup = document.querySelector('#first-note-group');
    const deckCounter = document.querySelector('#deck-counter');

    // 設定ポップアップメニュー関連要素
    const openSettingsBtn = document.querySelector('#open-settings');
    const settingsPopup = document.querySelector('#settings-popup');
    const speedSlowBtn = document.querySelector('#speed-slow-btn');
    const speedFastBtn = document.querySelector('#speed-fast-btn');
    const soundNoneBtn = document.querySelector('#sound-none-btn');
    const soundExistsBtn = document.querySelector('#sound-exists-btn');
    const langOffBtn = document.querySelector('#lang-off-btn');
    const langOnBtn = document.querySelector('#lang-on-btn');

    // 多言語テキスト辞書
    const i18n = {
      ja: {
        settings: "⚙️ 設定",
        langLabel: "English",
        speedLabel: "問題の再生スピード",
        speedSlow: "遅い",
        speedFast: "速い",
        soundLabel: "正誤判定のサウンド",
        soundExists: "あり",
        soundNone: "なし",
        qType: "問題:",
        optChord: "コード",
        optScale: "スケール",
        optMelody: "メロディ",
        nextMelody: "▶ 次のメロディ",
        nextChord: "▶ 次のコード（4問）",
        melodyProgress: (i, n) => `${i}/4問 · ${n}音`,
        noteCount: "音数:",
        opt2: "2音",
        opt3: "3音",
        opt4: "4音",
        firstNote: "コード問題の最初の音",
        optRoot: "ルート音",
        optRandom: "ルート音以外",
        startBtn: "▶ ゲームを始める",
        skipBtn: "⏭ スキップ",
        replayBtn: "🔊 もう一度聴く",
        viewResultBtn: "👁️ 正解を確認する",
        playChordBtn: "🎸 コードを鳴らす",
        legendRoot: "ルート音（根音）/ キー音",
        initialMsg: "「ゲームを始める」を押してください",
        chordTitleLabel: "コード名",
        scaleTitleLabel: "スケール名",
        levelTension: (w) => `🔥 テンションコード解放中！\n(連続不正解: ${w}/2 で難易度ダウン)`,
        levelBasic: (c) => `🎵 基本コードモード\n(連続正解: ${c}/5 でテンション解放)`,
        progressScale: (idx, total) => `進捗: ${idx}/${total}`,
        progressChord: (corr, total) => `正解数: ${corr}/${total}`,
        chordPlaying: "和音を再生中…",
        scalePlaying: "キー音再生中・・・",
        firstNoteGuessPrompt: "1音目の音: フレットボードから音を選んでください",
        listenCarefully: (i, total) => `よく聴いてください… (${i} / ${total}音目)`,
        guessNextPrompt: (curr, total) => `次の音をクリックしてください（${curr} / ${total}）`,
        guessFirstPrompt: (total) => `聴こえた順に、フレットを${total}つクリックしてください（1 / ${total}）`,
        correctMsg: "🎉 正解！",
        correctStreakMsg: (c) => `🎉 正解！ [${c}/5 連続正解]`,
        tensionUnlockedMsg: "🎉 5問連続正解！🔥 テンションコード問題が解放されました！",
        wrongMsg: "❌ 不正解。",
        wrongStreakMsg: (w) => `❌ 不正解。[連続不正解: ${w}/2]`,
        tensionDowngradeMsg: "❌ 2問連続不正解。基本コードモードに戻ります。",
        replayCorrecting: (i) => `${i}音目：正解位置を再生中…`
      },
      en: {
        settings: "⚙️ Settings",
        langLabel: "English",
        speedLabel: "Playback Speed",
        speedSlow: "Slow",
        speedFast: "Fast",
        soundLabel: "Judgment Sound",
        soundExists: "On",
        soundNone: "None",
        qType: "Mode:",
        optChord: "Chord",
        optScale: "Scale",
        optMelody: "Melody",
        nextMelody: "▶ Next Melody",
        nextChord: "▶ Next Chord (4 Questions)",
        melodyProgress: (i, n) => `${i}/4 · ${n} notes`,
        noteCount: "Notes:",
        opt2: "2 Notes",
        opt3: "3 Notes",
        opt4: "4 Notes",
        firstNote: "First Note of Chord Questions",
        optRoot: "Root Note",
        optRandom: "Non-root Note",
        startBtn: "▶ Start Game",
        skipBtn: "⏭ Skip",
        replayBtn: "🔊 Listen Again",
        viewResultBtn: "👁️ Show Answer",
        playChordBtn: "🎸 Play Chord",
        legendRoot: "Root Note / Key Note",
        initialMsg: "Click 'Start Game' to begin",
        chordTitleLabel: "CHORD",
        scaleTitleLabel: "SCALE",
        levelTension: (w) => `🔥 Tension Chords Unlocked!\n(Consecutive Wrong: ${w}/2 to downgrade)`,
        levelBasic: (c) => `🎵 Basic Chord Mode\n(Consecutive Correct: ${c}/5 to unlock tension)`,
        progressScale: (idx, total) => `Progress: ${idx}/${total}`,
        progressChord: (corr, total) => `Correct: ${corr}/${total}`,
        chordPlaying: "Playing chord...",
        scalePlaying: "Playing key note...",
        firstNoteGuessPrompt: "1st Note: Select a note from the fretboard",
        listenCarefully: (i, total) => `Listen carefully... (${i} / ${total})`,
        guessNextPrompt: (curr, total) => `Click the next note (${curr} / ${total})`,
        guessFirstPrompt: (total) => `Click ${total} notes in the order you hear them (1 / ${total})`,
        correctMsg: "🎉 Correct!",
        correctStreakMsg: (c) => `🎉 Correct! [${c}/5 Streak]`,
        tensionUnlockedMsg: "🎉 5 Correct in a row! 🔥 Tension chords unlocked!",
        wrongMsg: "❌ Incorrect.",
        wrongStreakMsg: (w) => `❌ Incorrect. [Streak: ${w}/2]`,
        tensionDowngradeMsg: "❌ 2 Incorrect in a row. Returning to Basic mode.",
        replayCorrecting: (i) => `Note ${i}: Playing correct position...`
      }
    };

    // 設定状態の管理
    let appSettings = {
      firstNote: 'root',
      speed: 'slow',
      sound: 'exists',
      lang: 'off'
    };

    function t(key, ...args) {
      const activeLang = appSettings.lang === 'on' ? 'en' : 'ja';
      const dict = i18n[activeLang] || i18n.ja;
      const val = dict[key];
      if (typeof val === 'function') {
        return val(...args);
      }
      return val || i18n.ja[key] || key;
    }

    function updateStaticTexts() {
      document.querySelector('#scroll-description').textContent = appSettings.lang === 'on' ? 'Swipe here to move the fretboard left or right' : '指板の左右移動はここをスワイプ';
      document.querySelector('#scroll-pad').setAttribute('aria-label', appSettings.lang === 'on' ? 'Scroll fretboard horizontally' : '指板の横スクロール');
      document.documentElement.lang = appSettings.lang === 'on' ? 'en' : 'ja';
      document.querySelector('#modal-title-settings').textContent = t('settings');
      document.querySelector('#label-lang-setting').textContent = t('langLabel');
      document.querySelector('#lang-off-btn').textContent = appSettings.lang === 'on' ? 'OFF (Japanese)' : 'OFF (日本語)';
      document.querySelector('#lang-on-btn').textContent = appSettings.lang === 'on' ? 'ON (English)' : 'ON (English)';

      document.querySelector('#label-speed-setting').textContent = t('speedLabel');
      document.querySelector('#speed-slow-btn').textContent = t('speedSlow');
      document.querySelector('#speed-fast-btn').textContent = t('speedFast');
      document.querySelector('#label-sound-setting').textContent = t('soundLabel');
      document.querySelector('#sound-exists-btn').textContent = t('soundExists');
      document.querySelector('#sound-none-btn').textContent = t('soundNone');
      
      document.querySelector('#label-q-type').textContent = t('qType');
      questionTypeSelect.options[0].textContent = t('optChord');
      questionTypeSelect.options[1].textContent = t('optScale');
      questionTypeSelect.options[2].textContent = t('optMelody');
      updateSelectWidth(questionTypeSelect);

      document.querySelector('#label-note-count').textContent = t('noteCount');
      noteCountSelect.options[0].textContent = t('opt2');
      noteCountSelect.options[1].textContent = t('opt3');
      noteCountSelect.options[2].textContent = t('opt4');
      updateSelectWidth(noteCountSelect);

      document.querySelector('#label-first-note').textContent = t('firstNote');
      document.querySelector('#first-note-root-btn').textContent = t('optRoot');
      document.querySelector('#first-note-random-btn').textContent = t('optRandom');

      updateStartButton();
      if (game.phase === 'result') {
        replayButton.textContent = t('viewResultBtn');
      } else {
        replayButton.textContent = t('replayBtn');
      }
      playChordBtn.textContent = t('playChordBtn');

      if (game.phase === 'idle') {
        setStatus(null, t('initialMsg'));
      }

      if (questionTypeSelect.value !== 'scale') {
        targetLabel.textContent = t('chordTitleLabel');
      } else {
        targetLabel.textContent = t('scaleTitleLabel');
      }

      updateLevelIndicator();
      updateDeckCounterDisplay();
    }

    function updateSettingsUI() {
      firstNoteControls.querySelectorAll('[data-first-note]').forEach(button => {
        const selected = button.dataset.firstNote === appSettings.firstNote;
        button.classList.toggle('active', selected);
        button.setAttribute('aria-pressed', String(selected));
      });
      if (appSettings.lang === 'on') {
        langOnBtn.classList.add('active');
        langOffBtn.classList.remove('active');
      } else {
        langOffBtn.classList.add('active');
        langOnBtn.classList.remove('active');
      }

    // Degree motifs, their rotations and retrogrades provide varied contours.
    // The occasional flat ninth is a passing note, never an unsupported endpoint.
    const melodyDefinitions = [

      { name: 'm', intervals: [0, 3, 7], scale: [0, 2, 3, 5, 7, 9, 10], endpoints: [0, 2, 3, 5, 7, 9, 10] },

    ];
    const melodyMotifs = [
      [1, 2, 4, 3], [1, 2, 3, 5], [1, 6, 2, 5], [3, 5, 2, 1],
      [1, 3, 2, 5], [5, 3, 6, 2], [1, 5, 3, 2], [2, 5, 3, 1],
      [1, 2, 4, 3, 5], [1, 6, 2, 5, 3], [3, 'b9', 1, 7, 6],

    function melodyCandidates(def, rootMidi, count, stepwise) {
      const degreeOffset = degree => degree === 'b9' ? 1
        : def.scale[(degree - 1) % def.scale.length] + 12 * Math.floor((degree - 1) / def.scale.length);
      const motifs = stepwise
        ? Array.from({ length: def.scale.length }, (_, i) => Array.from({ length: count }, (_, j) => i + j + 1))
        : melodyMotifs.filter(motif => motif.length === count);
      const candidates = new Map();
      for (const motif of motifs) {
        for (let rotation = 0; rotation < (stepwise ? 1 : motif.length); rotation++) {
          const rotated = motif.slice(rotation).concat(motif.slice(0, rotation));
          for (const degrees of [rotated, [...rotated].reverse()]) {
            const offsets = degrees.map(degreeOffset);
            if (![offsets[0], offsets.at(-1)].every(n => def.endpoints.includes(n % 12))) continue;
            const midis = offsets.map(n => rootMidi + n);
            // Keep the entire phrase in a compact, playable region of the board.
            for (let anchor = 1; anchor <= 11; anchor++) {
              const sequence = midis.map(midi => positions.find(p => p.midi === midi && p.fret >= anchor && p.fret <= anchor + 4));
              if (sequence.every(Boolean)) {
                candidates.set(midis.join(','), sequence);
                break;
              }
            }
          }
        }
      }
      return [...candidates.values()];
    }

    function makeMelodyQuestion() {
      if (!melodyBatch || melodyBatch.index >= 4) {
        const roll = Math.random();
        const def = melodyDefinitions[roll < .45 ? 0 : roll < .9 ? 1 : 2];
        const rootPitchIndex = Math.floor(Math.random() * 12);
        // All twelve keys fit between G3 and F-sharp4 in the app's register.
        const rootMidi = 55 + (rootPitchIndex - 7 + 12) % 12;
        melodyBatch = { def, rootMidi, rootPitchIndex, index: 0, used: new Set() };
      }
      const batch = melodyBatch;
      const count = Math.random() < .5 ? 4 : 5;
      const stepwise = Math.random() < .1;
      const isRoot = position => position.midi % 12 === batch.rootPitchIndex;
      const eligible = sequence => !batch.used.has(sequence.map(p => p.midi).join(','))
        && (difficulty().hard ? !sequence.some(isRoot) : sequence.some(isRoot));
      let candidates = melodyCandidates(batch.def, batch.rootMidi, count, stepwise).filter(eligible);
      if (!candidates.length) candidates = melodyCandidates(batch.def, batch.rootMidi, count, false).filter(eligible);
      if (!candidates.length) throw new Error('No playable melody candidates');
      // Keep root openings uncommon in EASY; HARD excludes every root pitch class.
      const rootOpening = Math.random() < .1;
      const preferred = candidates.filter(sequence => isRoot(sequence[0]) === rootOpening);
      const pool = preferred.length ? preferred : candidates;
      const sequence = pool[Math.floor(Math.random() * pool.length)];
      batch.used.add(sequence.map(p => p.midi).join(','));
      batch.index++;
      return {
        sequence, titleName: pitchNames[batch.rootPitchIndex] + batch.def.name,
        rootPitchIndex: batch.rootPitchIndex,
        chordMidiNotes: batch.def.intervals.map(n => batch.rootMidi + n),
        melodyIndex: batch.index
      };
    }

    // A sustained, warm body plus a short bell-like attack; no reverb or audio loop.
    function play(midi, sustain = .56, volume = .35, scheduledTime) {
      if (document.hidden) return () => {};
      const ctx = ensureAudio();
      const now = scheduledTime ?? ctx.currentTime;
      const frequency = 440 * 2 ** ((midi - 69) / 12);
      const duration = sustain === null ? null : Math.max(.08, sustain);
      const level = volume * .46;
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      const tine = ctx.createOscillator();
      const tineGain = ctx.createGain();
      // Keep note envelopes intact; a separate gain controls the release of both layers.
      const releaseGain = ctx.createGain();
      releaseGain.gain.setValueAtTime(1, ctx.currentTime);
      releaseGain.connect(ctx.destination);
      osc.setPeriodicWave(trainingWave);
      osc.frequency.setValueAtTime(frequency, now);
      tine.type = 'sine';
      tine.frequency.setValueAtTime(frequency * 4, now);
      const decayTime = duration === null ? .18 : Math.min(.18, duration * .5);
      gain.gain.setValueAtTime(0, now);
      gain.gain.linearRampToValueAtTime(level, now + .005);
      gain.gain.linearRampToValueAtTime(level * .78, now + decayTime);
      const tineDuration = duration === null ? .24 : Math.min(.24, duration);
      tineGain.gain.setValueAtTime(0, now);
      tineGain.gain.linearRampToValueAtTime(level * .24, now + .003);
      tineGain.gain.exponentialRampToValueAtTime(.0001, now + tineDuration);
      osc.connect(gain).connect(releaseGain);
      tine.connect(tineGain).connect(releaseGain);
      let stopped = false;
      let tineEnded = false;
      let bodyEnded = false;
      const disconnectRelease = () => {
        if (bodyEnded && tineEnded) releaseGain.disconnect();
      };
      const stop = () => {
        if (stopped) return;
        stopped = true;
        const at = ctx.currentTime;
        // Cancelling an in-progress attack/decay ramp can abruptly change its value.
        // Fade a previously constant gain instead, reaching exact silence before stop().
        releaseGain.gain.setValueAtTime(1, at);
        releaseGain.gain.linearRampToValueAtTime(0, at + .07);
        osc.stop(at + .085);
        if (!tineEnded) tine.stop(at + .085);
      };
      activeVoices.add(stop);
      osc.onended = () => {
        stopped = true;
        bodyEnded = true;
        activeVoices.delete(stop);
        osc.disconnect();
        gain.disconnect();
        disconnectRelease();
      };
      tine.onended = () => {
        tineEnded = true;
        tine.disconnect();
        tineGain.disconnect();
        disconnectRelease();
      };
      // Always schedule start before stop (required by Web Audio).
      osc.start(now);
      tine.start(now);
      tine.stop(now + tineDuration + .01);
      if (duration !== null) {
        const end = now + duration;
        gain.gain.setValueAtTime(level * .78, Math.max(now + decayTime, end - .06));
        gain.gain.linearRampToValueAtTime(0, end);
        osc.stop(end + .02);
      }
      return stop;
    }

    function playJudgmentSound(isCorrect) {
      if (appSettings.sound !== 'exists') return;
      audioContext ??= new (window.AudioContext || window.webkitAudioContext)({ latencyHint: 'interactive' });
      const now = audioContext.currentTime;

      if (isCorrect) {
        [ { freq: 523.25, time: 0, dur: 0.22 }, { freq: 783.99, time: 0.18, dur: 0.35 } ].forEach(note => {
          const startTime = now + note.time;
          const osc = audioContext.createOscillator();
          const gain = audioContext.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(note.freq, startTime);
          
          // --- 判定サウンドのアタック・リリースを滑らかに ---
          gain.gain.setValueAtTime(0.0001, startTime);
          gain.gain.linearRampToValueAtTime(0.28, startTime + 0.015);
          gain.gain.exponentialRampToValueAtTime(0.0001, startTime + note.dur);

          osc.connect(gain);
          gain.connect(audioContext.destination);
          osc.onended = () => { osc.disconnect(); gain.disconnect(); };
          osc.start(startTime);
          osc.stop(startTime + note.dur + 0.03);
        });
      } else {
        [110, 116.5].forEach(freq => {
          const osc = audioContext.createOscillator();
          const gain = audioContext.createGain();
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(freq, now);

          gain.gain.setValueAtTime(0.0001, now);
          gain.gain.linearRampToValueAtTime(0.22, now + 0.015);
          gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.35);

          osc.connect(gain);
          gain.connect(audioContext.destination);
          osc.onended = () => { osc.disconnect(); gain.disconnect(); };
          osc.start(now);
          osc.stop(now + 0.38);
        });
      }
    }

    function playClassicalGuitarNote(midi, startTime, duration = 2, volume = .28) {
      return play(midi, duration, volume, startTime);
    }

    function playChord(midiNotes) {
      if (!midiNotes || midiNotes.length === 0) return;
      const sortedMidis = [...midiNotes].sort((a, b) => a - b);
      const speedFactor = appSettings.speed === 'fast' ? 0.5 : 1.0;
      
      const startTime = ensureAudio().currentTime;
      const endTime = startTime + 1.2 * speedFactor;
      sortedMidis.forEach((midi, idx) => {
        const isRoot = (midi % 12 === game.rootPitchIndex);
        const noteStartTime = startTime + (isRoot ? 0 : idx * .045 * speedFactor);
        // Every voice shares the same final 60 ms release and silence time.
        play(midi, endTime - noteStartTime, isRoot ? .4 : .25, noteStartTime);
      });
    }

    async function playChordArpeggio() {
      if (!['guess', 'result'].includes(game.phase) || game.mode === 'scale') return;
      if (!game.chordMidiNotes || game.chordMidiNotes.length === 0) return;
      playChordBtn.disabled = true;
      startButton.disabled = replayButton.disabled = true;
      questionTypeSelect.disabled = noteCountSelect.disabled = firstNoteControls.disabled = true;
      await unlockAudio();

      const sortedMidis = [...game.chordMidiNotes].sort((a, b) => a - b);
      const speedFactor = appSettings.speed === 'fast' ? 0.5 : 1.0;

      const intervalMs = 280 * speedFactor;
      const sustainTime = 1.0 * speedFactor;
      const startTime = audioContext.currentTime;

      const endTime = startTime + (sortedMidis.length - 1) * intervalMs / 1000 + sustainTime;
      sortedMidis.forEach((midi, index) => {
        const noteStartTime = startTime + (index * intervalMs / 1000);
        // Keep the staggered attacks, then release all chord tones together.
        playClassicalGuitarNote(midi, noteStartTime, endTime - noteStartTime, 0.28);
      });

      const totalWaitMs = (sortedMidis.length - 1) * intervalMs + (sustainTime * 1000);
      await wait(totalWaitMs);

      playChordBtn.disabled = false;
      startButton.disabled = replayButton.disabled = false;
      questionTypeSelect.disabled = noteCountSelect.disabled = firstNoteControls.disabled = false;
    }

    playChordBtn.addEventListener('click', () => runPlayback(playChordArpeggio));

    let lastPlayingCell = null;
    let playingTimeoutId = null;

    function preview(cell, string, fret, showStatus = true, sustain = 0.56, showVisual = true, isCorrectStyle = false, isWrongStyle = false) {
      const midi = string.midi + fret;
      const note = noteName(midi);
      if (showStatus) setStatus(null, `${string.name} String / ${fret} Fret — ${note}`);
      const speedFactor = appSettings.speed === 'fast' ? 0.5 : 1.0;
      play(midi, sustain * speedFactor);
      if (!showVisual) return;
      
      if (playingTimeoutId) {
        clearTimeout(playingTimeoutId);
        playingTimeoutId = null;
      }
      if (lastPlayingCell) {
        lastPlayingCell.classList.remove('playing', 'playing-correct', 'playing-wrong');
      }

      let activeClass = 'playing';
      if (isCorrectStyle) activeClass = 'playing-correct';
      if (isWrongStyle) activeClass = 'playing-wrong';

      cell.classList.remove('playing', 'playing-correct', 'playing-wrong');
      void cell.getBoundingClientRect();
      cell.classList.add(activeClass);

      lastPlayingCell = cell;
      playingTimeoutId = setTimeout(() => {
        cell.classList.remove(activeClass);
        if (lastPlayingCell === cell) {
          lastPlayingCell = null;
        }
        playingTimeoutId = null;
      }, getAdjustedTime(450));
    }

    const wait = ms => new Promise(resolve => setTimeout(resolve, ms));
    
    function clearBoardMarks() {
      playChordBtn.disabled = true;
      positions.forEach(position => position.cell.classList.remove('selected', 'correct', 'wrong', 'playing', 'playing-correct', 'playing-wrong', 'computer-first'));
      if (rootMarkerGroup) {
        rootMarkerGroup.innerHTML = '';
      }
    }

    function highlightRootNotes(rootPitchIndex) {
      if (!rootMarkerGroup) return;
      rootMarkerGroup.innerHTML = '';
      
      positions.forEach(pos => {
        if (pos.midi % 12 === rootPitchIndex) {
          const circle = node('circle', {
            cx: pos.cx,
            cy: pos.cy,
            r: 18,
            class: 'root-marker'
          });
          rootMarkerGroup.append(circle);
        }
      });
    }

    function isOctaveInterval(posA, posB) {
      const diff = Math.abs(posA.midi - posB.midi);
      return diff > 0 && diff % 12 === 0;
    }

    function hasConsecutiveOctave(seq) {
      for (let i = 0; i < seq.length - 1; i++) {
        if (isOctaveInterval(seq[i], seq[i + 1])) return true;
      }
      return false;
    }

    function fitChordToFretboard(midiNotes) {
      if (!midiNotes.length) return [];
      const highestFretboardMidi = Math.max(...strings.map(string => string.midi + frets));
      const excess = Math.max(...midiNotes) - highestFretboardMidi;
      const octaveShift = Math.max(0, Math.ceil(excess / 12)) * 12;
      return midiNotes.map(midi => midi - octaveShift);
    }

    function makeChordQuestion(count, isRootFirst) {
      let attempts = 0;
      const availableDefs = difficulty().hard 
        ? tensionChordDefinitions
        : basicChordDefinitions;

      const firstCandidates = positions.filter(pos => pos.fret >= 1 && pos.fret <= 10);

      while (attempts < 2500) {
        attempts++;
        const rootPitchIndex = Math.floor(Math.random() * 12);
        const rootName = pitchNames[rootPitchIndex];
        const chordDef = availableDefs[Math.floor(Math.random() * availableDefs.length)];
        const chordName = rootName + chordDef.name;

        if (firstCandidates.length === 0) break;
        const first = firstCandidates[Math.floor(Math.random() * firstCandidates.length)];
        const firstPitchClass = first.midi % 12;

        if (isRootFirst) {
          if (firstPitchClass !== rootPitchIndex) continue;
        } else {
          const nonRootIntervals = chordDef.intervals.filter(i => i % 12 !== 0);
          const nonRootPitchClasses = nonRootIntervals.map(i => (rootPitchIndex + i) % 12);
          if (!nonRootPitchClasses.includes(firstPitchClass)) continue;
        }

        const targetPitchClasses = chordDef.intervals.map(i => (rootPitchIndex + i) % 12);

        const candidates = positions.filter(pos => {
          if (pos === first) return false;
          if (Math.abs(pos.fret - first.fret) > 4) return false;
          if (!targetPitchClasses.includes(pos.midi % 12)) return false;
          
          if (pos.midi % 12 === firstPitchClass) {
            return Math.random() < 0.15;
          }
          return true;
        });

        if (candidates.length < count - 1) continue;

        const shuffled = [...candidates];
        for (let i = shuffled.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
        }
        let validSeq = null;

        const maxRangeMidi = chordDef.isTension ? 24 : 12;

        const isValidSequence = (seq) => {
          const minF = Math.min(...seq.map(p => p.fret));
          const maxF = Math.max(...seq.map(p => p.fret));
          if (maxF - minF > 4) return false;

          const minMidi = Math.min(...seq.map(p => p.midi));
          const maxMidi = Math.max(...seq.map(p => p.midi));
          if (maxMidi - minMidi > maxRangeMidi) return false;

          if (hasConsecutiveOctave(seq)) return false;

          return true;
        };

        if (count === 2) {
          const seq = [first, shuffled[0]];
          if (isValidSequence(seq)) { validSeq = seq; }
        } else if (count === 3) {
          for (let i = 0; i < shuffled.length; i++) {
            for (let j = i + 1; j < shuffled.length; j++) {
              const seq = [first, shuffled[i], shuffled[j]];
              if (isValidSequence(seq)) { validSeq = seq; break; }
            }
            if (validSeq) break;
          }
        } else if (count === 4) {
          for (let i = 0; i < shuffled.length; i++) {
            for (let j = i + 1; j < shuffled.length; j++) {
              for (let k = j + 1; k < shuffled.length; k++) {
                const seq = [first, shuffled[i], shuffled[j], shuffled[k]];
                if (isValidSequence(seq)) { validSeq = seq; break; }
              }
              if (validSeq) break;
            }
            if (validSeq) break;
          }
        }

        if (validSeq && validSeq.length === count) {
          const baseMidi = 60 + rootPitchIndex;
          const chordMidiNotes = fitChordToFretboard(chordDef.intervals.map(i => baseMidi + i));
          return { sequence: validSeq, titleName: chordName, displayKey: chordName, rootPitchIndex, chordMidiNotes };
        }
      }

      const fallbackSeq = positions.filter(p => p.fret >= 1 && p.fret <= 10).slice(0, count);
      return { sequence: fallbackSeq, titleName: 'C Major', displayKey: 'C Major', rootPitchIndex: 0, chordMidiNotes: [60, 64, 67] };
    }

    function makeScaleQuestion() {
      let outerAttempts = 0;

      while (outerAttempts < 50) {
        outerAttempts++;

        if (scaleDeck.length === 0) {
          resetScaleDeck();
        }

        // Preserve unseen advanced patterns while EASY repeats the seven modes.
        const eligibleIndex = scaleDeck.findIndex(item => difficulty().hard
          || jazzScaleDefinitions.indexOf(item.scaleDef) < 7);
        const item = eligibleIndex >= 0 ? scaleDeck.splice(eligibleIndex, 1)[0]
          : { scaleDef: jazzScaleDefinitions[Math.floor(Math.random() * 7)], isDescending: Math.random() < .5 };
        currentScaleIndex++;
        updateDeckCounterDisplay();

        const scaleDef = item.scaleDef;
        const isDescending = item.isDescending;

        let innerAttempts = 0;
        while (innerAttempts < 100) {
          innerAttempts++;
          const rootPitchIndex = Math.floor(Math.random() * 12);
          const rootName = pitchNames[rootPitchIndex];
          const scaleTitle = `${rootName} ${scaleDef.name}`;
          const displayKey = `${rootName} Key`;

          const firstCandidates = positions.filter(pos => pos.midi % 12 === rootPitchIndex && pos.fret >= 1 && pos.fret <= 8);
          if (firstCandidates.length === 0) continue;
          const anchorRoot = firstCandidates[Math.floor(Math.random() * firstCandidates.length)];

          let ascendingSequence = [anchorRoot];
          let possible = true;

          for (let i = 1; i < scaleDef.intervals.length; i++) {
            const targetMidi = anchorRoot.midi + scaleDef.intervals[i];
            const options = positions.filter(pos => 
              pos.midi === targetMidi && Math.abs(pos.fret - anchorRoot.fret) <= 4
            );

            if (options.length === 0) {
              possible = false;
              break;
            }
            options.sort((a, b) => Math.abs(a.fret - anchorRoot.fret) - Math.abs(b.fret - anchorRoot.fret));
            ascendingSequence.push(options[0]);
          }

          if (possible) {
            const finalSequence = isDescending ? [...ascendingSequence].reverse() : ascendingSequence;

            return {
              sequence: finalSequence,
              titleName: scaleTitle,
              displayKey: displayKey,
              rootPitchIndex,
              chordMidiNotes: []
            };
          }
        }
      }

      const fallbackSeq = positions.filter(p => p.fret >= 1 && p.fret <= 8).slice(0, 8);
      return { sequence: fallbackSeq, titleName: 'C Major Scale', displayKey: 'C Key', rootPitchIndex: 0, chordMidiNotes: [] };
    }

    function findCloseFretForTarget(targetPos) {
      if (!game.target || game.target.length === 0) return targetPos;

      const candidates = positions.filter(pos => pos.midi === targetPos.midi);
      if (candidates.length === 0) return targetPos;

      const userRootAns = game.answers.find(ans => ans.midi % 12 === game.rootPitchIndex);
      const targetRootPos = game.target.find(pos => pos.midi % 12 === game.rootPitchIndex);
      
      const refRootFret = userRootAns ? userRootAns.fret : (targetRootPos ? targetRootPos.fret : null);
      
      const avgFret = game.target.reduce((sum, pos) => sum + pos.fret, 0) / game.target.length;

      candidates.sort((a, b) => {
        if (refRootFret !== null) {
          const diffA = Math.abs(a.fret - refRootFret);
          const diffB = Math.abs(b.fret - refRootFret);
          if (diffA !== diffB) return diffA - diffB;
        }
        return Math.abs(a.fret - avgFret) - Math.abs(b.fret - avgFret);
      });

      return candidates[0];
    }

    async function playQuestion(includeMelodyChord = false, includeScaleKey = false) {
      if (!game.target.length) return;
      playChordBtn.disabled = true;
      startButton.disabled = replayButton.disabled = true;
      questionTypeSelect.disabled = noteCountSelect.disabled = firstNoteControls.disabled = true;
      await unlockAudio();
      activeVoices.forEach(stop => stop());
      const previousPhase = game.phase;
      game.phase = 'playing';
      startButton.disabled = true;
      replayButton.disabled = true;
      questionTypeSelect.disabled = true;
      noteCountSelect.disabled = true;
      firstNoteControls.disabled = true;

      const isShowingResult = (previousPhase === 'result');
      const total = game.target.length;
      if (game.mode === 'melody') highlightRootNotes(game.rootPitchIndex);

      const displayTitle = (game.mode !== 'scale' || isShowingResult) ? questionTitle() : game.displayKey;
      targetTitle.textContent = displayTitle;

      positions.forEach(p => p.cell.classList.remove('selected', 'correct', 'wrong', 'playing-correct', 'playing-wrong', 'computer-first'));

      if (!isShowingResult && game.target.length > 0) {
        game.target[0].cell.classList.add('computer-first');
      }

      if ((game.mode === 'chord' || (game.mode === 'melody' && includeMelodyChord)) && !isShowingResult) {
        highlightRootNotes(game.rootPitchIndex);
        setStatus(null, t('chordPlaying'));
        playChord(game.chordMidiNotes);
        await wait(getAdjustedTime(1500));
      } else if (game.mode === 'scale' && includeScaleKey && !isShowingResult) {
        highlightRootNotes(game.rootPitchIndex);
        setStatus(null, t('scalePlaying'));
        const firstNoteMidi = game.target[0].midi;
        play(firstNoteMidi, getAdjustedTime(1.05), 0.4);
        await wait(getAdjustedTime(1450));
      }

      for (let i = 0; i < total; i++) {
        let activePos = game.target[i];
        let isNoteCorrect = true;

        if (isShowingResult) {
          const userAns = game.answers[i];
          if (userAns && userAns.midi === game.target[i].midi) {
            activePos = userAns;
            isNoteCorrect = true;
          } else {
            activePos = findCloseFretForTarget(game.target[i]);
            isNoteCorrect = false;
          }
        }

        const msg = isShowingResult
          ? t('replayCorrecting', i + 1)
          : (i === 0 
              ? t('firstNoteGuessPrompt') 
              : t('listenCarefully', i + 1, total));

        setStatus(null, msg);
        
        const shouldShowVisual = isShowingResult || (i === 0);
        preview(
          activePos.cell, 
          activePos.string, 
          activePos.fret, 
          false, 
          .56, 
          shouldShowVisual, 
          isShowingResult && isNoteCorrect, 
          isShowingResult && !isNoteCorrect
        );

        if (isShowingResult) {
          activePos.cell.classList.add(isNoteCorrect ? 'correct' : 'wrong');
        }

        await wait(getAdjustedTime(beatMs * 1.3));
      }

      await wait(getAdjustedTime(400));

      if (previousPhase === 'result') {
        game.phase = 'result';
        showResult(false);
      } else {
        game.phase = 'guess';
        const currentAnsLen = game.answers.length;
        const msg = currentAnsLen > 0
          ? t('guessNextPrompt', currentAnsLen + 1, total)
          : t('guessFirstPrompt', total);
        setStatus(null, msg);
      }
      playChordBtn.disabled = game.mode === 'scale';
      startButton.disabled = false;
      updateStartButton();
      replayButton.disabled = false;
      questionTypeSelect.disabled = false;
      noteCountSelect.disabled = false;
      firstNoteControls.disabled = false;
    }

    function showResult(isNewAnswer = true) {
      const correct = game.answers.length === game.target.length && game.answers.every((ans, idx) => ans.midi === game.target[idx].midi);

      if (isNewAnswer && game.mode === 'melody') {
        melodyQuestionCount++;
        if (correct) melodyCorrectCount++;
        updateDeckCounterDisplay();
      }

      if (isNewAnswer) {
        clearTimeout(judgmentTimer);
        judgmentTimer = setTimeout(() => {
          if (!document.hidden) playJudgmentSound(correct);
        }, 500);
      }

      if (isNewAnswer && game.mode === 'chord') {
        chordQuestionCount++;
        if (correct) {
          chordCorrectCount++;
        }
        updateDeckCounterDisplay();
      }

      positions.forEach(p => p.cell.classList.remove('selected', 'correct', 'wrong', 'computer-first'));
      game.answers.forEach((ans, idx) => {
        const isNoteCorrect = ans.midi === game.target[idx].midi;
        if (isNoteCorrect) {
          ans.cell.classList.add('correct');
        } else {
          const closeFret = findCloseFretForTarget(game.target[idx]);
          closeFret.cell.classList.add('wrong');
        }
      });

      targetTitle.textContent = questionTitle();
      
      if (isNewAnswer) recordResult(correct);
      setStatus(null, t(correct ? 'correctMsg' : 'wrongMsg'), correct ? 'correct' : 'wrong');

      if (game.mode === 'chord' || game.mode === 'melody') {
        playChordBtn.disabled = false;
        updateLevelIndicator();
      } else {
        playChordBtn.disabled = true;
      }
      
      game.phase = 'result';
      startButton.disabled = false;
      updateStartButton();
      replayButton.textContent = t('viewResultBtn');
      replayButton.disabled = false;
    }

    function choose(position, shouldPreview = true) {
      if (game.phase !== 'guess') {
        return;
      }
      
      const targetLen = game.target.length;
      if (game.answers.length >= targetLen) return;

      game.answers.push(position);
      position.cell.classList.add('selected');

      if (game.answers.length < targetLen) {
        setStatus(null, t('guessNextPrompt', game.answers.length + 1, targetLen));
      } else {
        showResult(true);
      }
    }

    let currentHeldPosition = null;

    function startHeldNote(position) {
      if (playingTimeoutId) {
        clearTimeout(playingTimeoutId);
        playingTimeoutId = null;
      }
      if (lastPlayingCell) {
        lastPlayingCell.classList.remove('playing', 'playing-correct', 'playing-wrong');
        lastPlayingCell = null;
      }

      if (currentHeldPosition && currentHeldPosition !== position) {
        stopHeldNote(currentHeldPosition);
      }
      currentHeldPosition = position;

      position.stopHeld?.();
      position.stopHeld = play(position.midi, null);
      
      if (game.phase === 'guess') {
        position.cell.classList.add('playing');
      }
    }

    function stopHeldNote(position) {
      if (!position) return;
      position.stopHeld?.();
      position.stopHeld = null;
      position.cell.classList.remove('playing');
      if (currentHeldPosition === position) {
        currentHeldPosition = null;
      }
    }

    async function startGame() {
      clearTimeout(judgmentTimer);
      endGesture();
      ensureAudio();
      activeVoices.forEach(stop => stop());
      clearBoardMarks();
      replayButton.textContent = t('replayBtn');
      const mode = questionTypeSelect.value;
      let q;

      if (mode === 'chord') {
        targetLabel.textContent = t('chordTitleLabel');
        const count = parseInt(noteCountSelect.value, 10);
        const isRootFirst = appSettings.firstNote === 'root';
        q = makeChordQuestion(count, isRootFirst);
      } else if (mode === 'melody') {
        targetLabel.textContent = t('chordTitleLabel');
        q = makeMelodyQuestion();
      } else {
        targetLabel.textContent = t('scaleTitleLabel');
        q = makeScaleQuestion();
      }

      game = { 
        mode,
        phase: 'playing', 
        target: q.sequence, 
        answers: [], 
        titleName: q.titleName, 
        displayKey: q.displayKey,
        rootPitchIndex: q.rootPitchIndex,
        chordMidiNotes: q.chordMidiNotes,
        melodyIndex: q.melodyIndex
      };

      targetTitle.textContent = mode !== 'scale' ? questionTitle() : q.displayKey;
      updateDeckCounterDisplay();
      updateStartButton();
      centerPosition(game.target[0]);
      await playQuestion(mode === 'melody' && q.melodyIndex === 1, mode === 'scale');
    }

    startButton.addEventListener('click', () => runPlayback(startGame));

    replayButton.addEventListener('click', () => runPlayback(async () => {
      if (game.phase === 'guess') {
        game.answers = [];
        positions.forEach(p => p.cell.classList.remove('selected'));
        await playQuestion();
      } else if (game.phase === 'result') {
        await playQuestion();
      }
    }));

    svg.append(node('rect', { x: x0, y: y0, width: boardWidth, height: boardHeight, fill: '#4c2d20' }));
    for (let fret = 0; fret <= frets; fret++) {
      const x = fretX(fret);
      svg.append(node('line', { x1: x, y1: y0, x2: x, y2: y0 + boardHeight, stroke: fret === 0 ? '#f2ddba' : '#8f8174', 'stroke-width': fret === 0 ? 10 : 3 }));
    }
    [3, 5, 7, 9, 15].forEach(fret => svg.append(node('circle', { cx: (fretX(fret - 1) + fretX(fret)) / 2, cy: 166, r: 7, fill: '#e8c792' })));
    [116, 226].forEach(y => svg.append(node('circle', { cx: (fretX(11) + fretX(12)) / 2, cy: y, r: 7, fill: '#e8c792' })));

    rootMarkerGroup = node('g', { id: 'root-markers' });
    svg.append(rootMarkerGroup);

    strings.forEach((string, index) => {
      const y = y0 + 28 + index * 55;
      svg.append(node('line', { x1: 76, y1: y, x2: x0 + boardWidth, y2: y, stroke: '#cbc0ad', 'stroke-width': 2.5 + index * 1.4 }));
      const name = node('text', { x: 66, y: y + 5, class: 'string-name' });
      name.textContent = string.label;
      svg.append(name);
      
      for (let fret = 0; fret <= frets; fret++) {
        const left = fret === 0 ? x0 - 74 : fretX(fret - 1);
        const right = fretX(fret);
        const cell = node('g', { class: 'cell', tabindex: '0', role: 'button', 'aria-label': `${string.name} string ${fret} fret ${noteName(string.midi + fret)}` });
        cell.append(node('rect', { x: left, y: y - 25, width: right - left, height: 50, rx: 2 }));
        const label = node('text', { x: (left + right) / 2, y: y + 5, class: 'note' });
        label.textContent = noteName(string.midi + fret);
        cell.append(label);
        
        const position = { 
          cell, 
          string, 
          fret, 
          midi: string.midi + fret,
          cx: (left + right) / 2,
          cy: y
        };
        positions.push(position);
        
        cell.addEventListener('keydown', event => {
          if (event.key !== 'Enter' && event.key !== ' ') return;
          event.preventDefault();
          if (event.repeat || game.phase === 'playing') return;
          pressPosition(position);
        });
        cell.addEventListener('keyup', event => {
          if (event.key === 'Enter' || event.key === ' ') {
            event.preventDefault();
            stopHeldNote(position);
          }
        });
        cell.addEventListener('blur', () => stopHeldNote(position));
        svg.append(cell);
      }
    });

    const boardShell = document.querySelector('.board-shell');
    const scrollPad = document.querySelector('#scroll-pad');
    let gesture = null;
    let scrollGesture = null;

    function setBoardScroll(left) {
      const max = Math.max(0, boardShell.scrollWidth - boardShell.clientWidth);
      boardShell.scrollLeft = Math.max(0, Math.min(max, left));
    }
    function centerPosition(position) {
      if (!position) return;
      const viewportHalfWidth = boardShell.clientWidth / 2;
      let center = position;
      if (game.mode === 'scale') {
        const offset = ['G', 'D'].includes(position.string.name) ? -1 : 1;
        const adjacentFret = Math.max(0, Math.min(frets, position.fret + offset));
        center = positions.find(p => p.string === position.string && p.fret === adjacentFret) || position;
      }
      // The left SVG margin is physically clipped; scrolling stops at the board edge.
      const left = (center.cx - 44) * 900 / 1020 - viewportHalfWidth;
      setBoardScroll(game.mode === 'chord' && position.fret <= 2 ? 0 : left);
    }
    function pressPosition(position) {
      if (game.phase === 'playing') return;
      try {
        const ctx = ensureAudio();
        if (ctx.state !== 'running') ctx.resume().catch(recoverPlayback);
        // No long-press timer or release wait: schedule sound in this input event.
        startHeldNote(position);
        choose(position);
      } catch (error) {
        recoverPlayback(error);
      }
    }
    function endGesture() {
      if (!gesture) return;
      const current = gesture;
      gesture = null;
      stopHeldNote(current.position);
    }
    ['touchstart', 'touchmove', 'contextmenu', 'selectstart', 'dragstart'].forEach(type => {
      [boardShell, scrollPad].forEach(surface => {
        surface.addEventListener(type, event => { if (event.cancelable) event.preventDefault(); }, { passive:false });
      });
    });
    boardShell.addEventListener('pointerdown', event => {
      if (!event.isPrimary || event.button !== 0) return;
      event.preventDefault();
      endGesture();
      if (game.phase === 'playing') return;
      const position = positions.find(p => p.cell === event.target.closest('.cell'));
      if (!position) return;
      gesture = { id:event.pointerId, position };
      boardShell.setPointerCapture(event.pointerId);
      pressPosition(position);
    });
    boardShell.addEventListener('pointerup', event => { if (gesture?.id === event.pointerId) endGesture(); });
    boardShell.addEventListener('pointercancel', () => endGesture());
    boardShell.addEventListener('lostpointercapture', () => endGesture());

    scrollPad.addEventListener('pointerdown', event => {
      if (!event.isPrimary || event.button !== 0) return;
      event.preventDefault();
      scrollPad.setPointerCapture(event.pointerId);
      scrollGesture = { id:event.pointerId, x:event.clientX, left:boardShell.scrollLeft };
    });
    scrollPad.addEventListener('pointermove', event => {
      if (!scrollGesture || scrollGesture.id !== event.pointerId) return;
      setBoardScroll(scrollGesture.left - (event.clientX - scrollGesture.x));
    });
    ['pointerup', 'pointercancel', 'lostpointercapture'].forEach(type => {
      scrollPad.addEventListener(type, () => { scrollGesture = null; });
    });
    scrollPad.addEventListener('keydown', event => {
      const offsets = { ArrowLeft:-60, ArrowRight:60, Home:-Infinity, End:Infinity };
      if (!(event.key in offsets)) return;
      event.preventDefault();
      setBoardScroll(boardShell.scrollLeft + offsets[event.key]);
    });
    window.addEventListener('blur', () => {
      endGesture(); scrollGesture = null;
      stopHeldNote(currentHeldPosition);
      activeVoices.forEach(stop => stop());
    });
    document.addEventListener('visibilitychange', () => {
      if (document.hidden) {
        endGesture(); scrollGesture = null;
        stopHeldNote(currentHeldPosition);
        activeVoices.forEach(stop => stop());
      }
    });
    // Keep scrolling within the actual board after a viewport resize.
    window.addEventListener('resize', () => setBoardScroll(boardShell.scrollLeft));
    document.addEventListener('keydown', event => { if (event.key === 'Escape') settingsPopup.classList.remove('active'); });

    updateUIControls();
    updateSettingsUI();
  </script>
</body>
</html>
